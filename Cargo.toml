[package]
name = "lowvolume"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kalkanozgur/lowvolume"
description = "Taskbar mouse-wheel system volume control for Windows (LowMonitor family)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lowvolume"
path = "src/main.rs"

# Sürümler lowmonitor [workspace.dependencies] ile aynı tutulur (lowmon-tray git bağımlılığı olarak çeker).
[dependencies]
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true

